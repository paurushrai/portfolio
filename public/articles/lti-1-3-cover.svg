<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Building a Modern LTI 1.3 Tool with Next.js and Node.js">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="0.55" stop-color="#131316"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- decorative shield / lock motif, right side -->
  <g transform="translate(905 188)" opacity="0.9">
    <path d="M150 0 L292 50 V196 C292 300 226 360 150 392 C74 360 8 300 8 196 V50 Z"
          fill="none" stroke="#27272a" stroke-width="3"/>
    <path d="M150 26 L268 67 V194 C268 282 214 333 150 361 C86 333 32 282 32 194 V67 Z"
          fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.35" stroke-width="2"/>
    <!-- keyhole -->
    <rect x="118" y="150" width="64" height="92" rx="12" fill="none" stroke="#34d399" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M118 178 V162 a32 32 0 0 1 64 0 V178" fill="none" stroke="#34d399" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="150" cy="196" r="9" fill="#34d399" fill-opacity="0.7"/>
  </g>

  <!-- eyebrow tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">
    <g transform="translate(96 120)">
      <rect x="0" y="-26" width="92" height="38" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="46" y="0" fill="#6ee7b7" text-anchor="middle">LTI 1.3</text>
    </g>
    <g transform="translate(200 120)">
      <rect x="0" y="-26" width="78" height="38" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#3f3f46"/>
      <text x="39" y="0" fill="#a1a1aa" text-anchor="middle">OIDC</text>
    </g>
    <g transform="translate(290 120)">
      <rect x="0" y="-26" width="66" height="38" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#3f3f46"/>
      <text x="33" y="0" fill="#a1a1aa" text-anchor="middle">JWT</text>
    </g>
    <g transform="translate(368 120)">
      <rect x="0" y="-26" width="108" height="38" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#3f3f46"/>
      <text x="54" y="0" fill="#a1a1aa" text-anchor="middle">RSA256</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" fill="#fafafa">
    <text x="94" y="278" font-size="78" font-weight="800" letter-spacing="-2">Modern LTI 1.3</text>
    <text x="94" y="366" font-size="78" font-weight="800" letter-spacing="-2">Tooling</text>
  </g>

  <!-- subtitle -->
  <text x="96" y="436" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
        font-size="30" font-weight="500" fill="#a1a1aa">A production-ready architecture</text>

  <!-- stack line -->
  <g transform="translate(96 520)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600" fill="#d4d4d8">
    <rect x="-2" y="-30" width="6" height="40" rx="3" fill="#10b981"/>
    <text x="22" y="0">Next.js</text>
    <text x="148" y="0" fill="#52525b">·</text>
    <text x="174" y="0">Node.js</text>
    <text x="306" y="0" fill="#52525b">·</text>
    <text x="332" y="0">Docker</text>
  </g>
</svg>
