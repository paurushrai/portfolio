name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail on critical advisories in shipped (prod) dependencies. Kept at
      # `critical` (not `high`) because Next 14 carries high advisories fixable
      # only by the Next 16 major upgrade (tracked in docs/IMPROVEMENTS.md);
      # gating at `high` would make CI permanently red on an unpatchable dep.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=critical

      # Cheap gate first: fail fast on lint before the expensive build.
      - name: Lint
        run: npm run lint

      # `next build` runs Contentlayer + type-checks the app; the real gate.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
